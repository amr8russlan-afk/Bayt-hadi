<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>بيتنا هادي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: warm blush palette taken from the family illustration. A family photo hero, brand line, a 3x2 grid of icon tiles that jump to each section, family avatars, then the working sections, with a fixed bottom bar. */
:root {
  --bg: #FCF1EC;
  --surface: #FFFAF7;
  --fg: #5A3A2E;
  --muted: #7D5C50;
  --line: #F0D8D0;
  --accent: #C9435A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBDEE2;
  --star: #D99A1E;
  --star-soft: #FCEFD3;
  --ok: #4F9468;
  --shadow: 0 4px 14px rgba(150, 80, 65, .10);
  --ic-a: #EE8C9C;
  --ic-b: #F3B94D;
  --ic-c: #7FB48B;
  --ic-d: #8EC3D6;
  --ic-line: #7A4B3B;
  --font-display: "Baloo Bhaijaan 2", "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --font-body: "Tajawal", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1517; --surface: #2B1F22; --fg: #F6E7E2; --muted: #C4A9A1; --line: #4B3538;
    --accent: #F08C9D; --accent-ink: #3B1119; --accent-soft: #4B2A31;
    --star: #F0B93A; --star-soft: #3E3216; --ok: #7CC592;
    --shadow: 0 4px 14px rgba(0, 0, 0, .35);
    --ic-a: #F29AA8; --ic-b: #F3BE5A; --ic-c: #8CC698; --ic-d: #8EC3D6; --ic-line: #E8C9BE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1517; --surface: #2B1F22; --fg: #F6E7E2; --muted: #C4A9A1; --line: #4B3538;
  --accent: #F08C9D; --accent-ink: #3B1119; --accent-soft: #4B2A31;
  --star: #F0B93A; --star-soft: #3E3216; --ok: #7CC592;
  --shadow: 0 4px 14px rgba(0, 0, 0, .35);
  --ic-a: #F29AA8; --ic-b: #F3BE5A; --ic-c: #8CC698; --ic-d: #8EC3D6; --ic-line: #E8C9BE;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  direction: rtl;
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 20px calc(104px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.top h1 { font-size: 30px; font-weight: 800; line-height: 1.2; }
.top .day { color: var(--muted); font-size: 16px; margin-top: 2px; }
.ring { position: relative; width: 76px; height: 76px; flex: none; }
.ring svg { width: 76px; height: 76px; transform: rotate(90deg) scaleX(-1); }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset .4s ease; }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tab { text-align: start; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px; min-height: 72px; min-width: 0; }
.tab .name { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.3; }
.tab .sub { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tab[aria-selected="true"] .sub { color: var(--fg); }

.panel { display: flex; flex-direction: column; gap: 14px; }
.panel-head { display: flex; flex-direction: column; gap: 4px; }
.panel-head h2 { font-size: 22px; font-weight: 800; }
.panel-head p { margin: 0; color: var(--muted); font-size: 15px; max-width: 65ch; }

.timer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); flex-wrap: wrap; }
.timer .clock { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; min-width: 4.5ch; }
.timer .lbl { color: var(--muted); font-size: 14px; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; min-height: 44px; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }

.stars { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--star-soft); flex-wrap: wrap; }
.stars .row { display: flex; gap: 4px; }
.stars svg { width: 28px; height: 28px; }
.stars .on { fill: var(--star); stroke: var(--star); }
.stars .off { fill: none; stroke: var(--star); opacity: .55; }
.stars .msg { font-size: 15px; flex: 1 1 180px; min-width: 0; }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: stretch; gap: 6px; }
.task { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: start; padding: 10px 14px; min-height: 60px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.chk { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.chk svg { width: 18px; height: 18px; }
.task .txt { min-width: 0; overflow-wrap: anywhere; }
.task .tip { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; }
.chip { font-size: 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.task[aria-pressed="true"] { background: transparent; }
.task[aria-pressed="true"] .chk { background: var(--ok); border-color: var(--ok); color: #fff; }
.task[aria-pressed="true"] .txt-main { text-decoration: line-through; color: var(--muted); }
.del { width: 44px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
.task[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.task[aria-checked="true"] .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task.lunchedit { grid-template-columns: 1fr auto; }
.nameinp { font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 46px; width: 100%; min-width: 0; }
.today { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--accent); }
.today .lbl { color: var(--muted); font-size: 14px; }
.today .nm { font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.3; text-wrap: balance; }
.today .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.cat { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-size: 15px; }
.cat[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.tip.today-tag { color: var(--accent); font-weight: 700; }
.note { padding: 12px 14px; border-radius: 14px; background: var(--star-soft); font-size: 15px; }
.note ul { margin: 6px 0 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 4px; }
.btn.warn { background: #B3261E; color: #fff; }
.alert { margin-top: 8px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid #B3261E; font-size: 15px; }
.task.plainrow { grid-template-columns: 1fr auto; }
.task.plainrow.now { border-color: var(--accent); background: var(--accent-soft); }
.startbox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
.startbox input { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 46px; }
.salah { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 2px; min-height: 84px; min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.sbtn .sn { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.sbtn .st { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sbtn .ck { width: 18px; height: 18px; color: var(--accent); display: grid; place-items: center; }
.sbtn .ck svg { width: 18px; height: 18px; }
.sbtn[aria-pressed="false"] .ck { visibility: hidden; }
.sbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.sub-h { font-size: 19px; margin-top: 6px; }
.citysel { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 46px; }
.fine { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 65ch; }
.btn.small { align-self: flex-start; min-height: 40px; padding: 6px 14px; font-size: 15px; margin-top: 6px; }
.task.editrow { grid-template-columns: 1fr auto; }
.minbox { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
.minbox input { font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 46px; width: 5.5ch; min-width: 0; text-align: center; font-variant-numeric: tabular-nums; }
.empty { padding: 18px 14px; border: 1.5px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }

details.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
details.add summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; font-weight: 700; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-block: 8px 14px; }
.form .full { grid-column: 1 / -1; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--muted); min-width: 0; }
.form input, .form select { font: inherit; color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0; }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.panel-head h2 { align-self: flex-start; background: var(--accent-soft); padding: 2px 16px; border-radius: 999px; }
.tab, .task, .today, .timer, .sbtn, details.add { box-shadow: var(--shadow); }
.task, .tab, .today, .timer, details.add { border-radius: 18px; }
.hero { display: flex; flex-direction: column; gap: 14px; }
.photo { display: block; width: 100%; height: auto; aspect-ratio: 655 / 700; object-fit: cover; border-radius: 28px; box-shadow: var(--shadow); background: var(--accent-soft); }
.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.logo { width: 60px; height: 60px; }
.brand h1 { font-size: 36px; font-weight: 800; line-height: 1.2; }
.brand .tag { margin: 0; color: var(--muted); font-size: 16px; }
.daybar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
.daybar .day { font-weight: 500; font-size: 17px; }
.ic { display: inline-block; flex: none; }
.ic svg { width: 100%; height: 100%; display: block; }
.ic .a { fill: var(--ic-a); }
.ic .b { fill: var(--ic-b); }
.ic .c { fill: var(--ic-c); }
.ic .d { fill: var(--ic-d); }
.ic .w { fill: var(--surface); }
.ic .s { fill: none; stroke: var(--ic-line); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px 6px 12px; min-height: 108px; min-width: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); font-weight: 700; font-size: 15px; line-height: 1.3; text-align: center; }
.tile .ic { width: 46px; height: 46px; }
.task.hasicon { grid-template-columns: auto 1fr auto auto; }
.ic.ti { width: 30px; height: 30px; }
.family { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
.family h2 { font-size: 20px; font-weight: 800; }
.famrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fam { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; text-align: center; }
.fam img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-soft); background: var(--accent-soft); }
.fam .fn { font-weight: 700; font-size: 15px; }
.fam .fa { color: var(--accent); font-size: 13px; font-weight: 700; min-height: 1.4em; }
.bnav { position: fixed; inset-inline: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(120, 60, 50, .08); padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bnav .in { max-width: 560px; margin-inline: auto; display: flex; align-items: flex-end; justify-content: space-between; }
.bn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 56px; min-height: 54px; padding: 4px 6px; border: 0; background: transparent; border-radius: 14px; font-size: 13px; color: var(--muted); font-weight: 700; }
.bn .ic { width: 26px; height: 26px; }
.bn.home { background: var(--accent-soft); color: var(--accent); }
.bn.plus { width: 58px; height: 58px; min-height: 0; padding: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); margin-bottom: 8px; box-shadow: 0 6px 14px rgba(201, 67, 90, .35); }
.bn.plus .ic { width: 28px; height: 28px; }
.tiles { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { padding: 12px 4px 10px; min-height: 96px; font-size: 13.5px; border-radius: 18px; }
.tile .ic { width: 38px; height: 38px; }
.tile .ic.pl { color: var(--accent); }
.task.later { opacity: .72; }
.remind { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top, 0px) + 8px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); max-width: 528px; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 20px; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 10px 30px rgba(120, 50, 50, .28); }
.remind .rtxt { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.35; }
.remind .racts { display: flex; gap: 8px; flex-wrap: wrap; }
.remind-box { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
.swrow { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0; border: 0; background: transparent; font-weight: 700; text-align: start; }
.swtxt { display: flex; flex-direction: column; min-width: 0; }
.swsub { color: var(--muted); font-size: 14px; font-weight: 400; }
.track2 { position: relative; width: 54px; height: 32px; border-radius: 999px; background: var(--line); flex: none; border: 1px solid var(--muted); transition: background .15s; }
.track2::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: inset-inline-start .15s; }
.swrow[aria-checked="true"] .track2 { background: var(--accent); border-color: var(--accent); }
.swrow[aria-checked="true"] .track2::after { inset-inline-start: 25px; }
.tiles { grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { padding: 14px 6px 12px; min-height: 104px; font-size: 14.5px; border-radius: 20px; }
.tile .ic { width: 42px; height: 42px; }
.item .rbtn { flex: none; width: 66px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: 14px; font-weight: 700; padding: 4px; }
.recipe-li { list-style: none; }
.recipe { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; margin-top: 8px; border-radius: 14px; background: var(--bg); border: 1px dashed var(--muted); font-size: 16px; }
.today .recipe { background: var(--surface); }
.recipe h3 { margin: 6px 0 0; font-family: var(--font-display); font-size: 17px; }
.recipe ul, .recipe ol { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 4px; }
.chip.warn { color: var(--accent); border-color: var(--accent); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<style>
#bh-auth{position:fixed;inset:0;z-index:99999;background:#fcf1ec;display:flex;align-items:center;justify-content:center;padding:22px;font-family:inherit;direction:rtl}
#bh-auth .bh-card{width:min(100%,420px);background:#fff;border:1px solid #eadbd5;border-radius:24px;padding:26px;box-shadow:0 12px 40px #7b55441a;text-align:center}
#bh-auth h2{margin:0 0 8px;color:#765b5c;font-size:24px}
#bh-auth p{color:#826f6d;line-height:1.7;margin:0 0 18px}
#bh-auth input{display:block;width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #e4d4ce;border-radius:12px;margin:10px 0;font:inherit;background:#fff}
#bh-auth button{width:100%;padding:13px;border:0;border-radius:12px;background:#b77f87;color:#fff;font:inherit;font-weight:700;margin-top:10px;cursor:pointer}
#bh-auth button.secondary{background:#f5e9e6;color:#765b5c}
#bh-auth .bh-msg{font-size:13px;min-height:24px;margin-top:12px}
#bh-auth .bh-small{font-size:12px;margin-top:14px}
</style>

</head>
<body>



<div id="bh-auth">
 <div class="bh-card">
  <div style="font-size:42px;margin-bottom:8px">🏡</div>
  <h2>بيت هادي</h2>
  <p>سجّلوا الدخول بنفس الإيميل على الجهازين علشان بيانات البيت تتزامن تلقائيًا.</p>
  <form id="bh-login-form">
   <input id="bh-email" type="email" autocomplete="email" placeholder="الإيميل المشترك" required>
   <input id="bh-password" type="password" autocomplete="current-password" placeholder="كلمة المرور" minlength="6" required>
   <button id="bh-submit" type="submit">دخول</button>
  </form>
  <button id="bh-signup" class="secondary" type="button">إنشاء الحساب لأول مرة</button>
  <div id="bh-auth-msg" class="bh-msg" role="status"></div>
  <div class="bh-small">استخدموا نفس الحساب على موبايلك وموبايل زوجك.</div>
 </div>
</div>

  function babyAge() {
    var b = new Date(2026, 6, 14), n = new Date();
    var m = (n.getFullYear() - b.getFullYear()) * 12 + n.getMonth() - b.getMonth() - (n.getDate() < b.getDate() ? 1 : 0);
    if (m < 1) return 'أقل من شهر';
    if (m < 3) return m === 1 ? 'شهر' : 'شهرين';
    if (m < 12) return nf(m) + (m < 11 ? ' شهور' : ' شهر');
    return m < 24 ? 'سنة' : nf(Math.floor(m / 12)) + ' سنين';
  }
  function goTo(id) {
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var behavior = reduce ? 'auto' : 'smooth';
    if (id === 'top') { window.scrollTo({ top: 0, behavior: behavior }); return; }
    if (id === 'add') {
      var d = document.getElementById('add');
      d.open = true;
      d.scrollIntoView({ behavior: behavior, block: 'center' });
      setTimeout(function () { try { document.getElementById('new-text').focus({ preventScroll: true }); } catch (e) {} }, 350);
      return;
    }
    var n = document.getElementById(id);
    if (n) n.scrollIntoView({ behavior: behavior, block: 'start' });
  }
  function renderStatic() {
    document.getElementById('logo').innerHTML = svgOf('home');

    var tiles = document.getElementById('tiles');
    [
      ['list', 'المهام اليومية', 'tabs'],
      ['iron', 'كل ٣ أيام', 'cycle'],
      ['broom', 'التنضيف العميق', 'deep'],
      ['pot', 'وجبات الغدا', 'lunch'],
      ['apple', 'سناكس صحية', 'snack'],
      ['bottle', 'وجبات لولو', 'baby'],
      ['lunchbox', 'لانش بوكس نونو', 'lunchbox'],
      ['moon', 'الصلاة والأذكار', 'salah'],
      ['plus', 'إضافة مهمة', 'add']
    ].forEach(function (t) {
      var b = el('button', 'tile');
      b.type = 'button';
      b.appendChild(icon(t[0], t[0] === 'plus' ? 'pl' : ''));
      b.appendChild(el('span', null, t[1]));
      b.addEventListener('click', function () { goTo(t[2]); });
      tiles.appendChild(b);
    });

    var fam = document.getElementById('family');
    fam.appendChild(el('h2', null, 'أفراد الأسرة'));
    var row = el('div', 'famrow');
    [
      { n: 'الزوج', a: '', img: AV.dad },
      { n: 'الزوجة', a: '', img: AV.mom },
      { n: 'نونو', a: '٣ سنين', img: AV.nono },
      { n: 'لولو', a: babyAge(), img: AV.lulu }
    ].forEach(function (p) {
      var f = el('div', 'fam');
      var im = document.createElement('img');

    fam.appendChild(row);

    var nav = document.getElementById('bnav-in');
    [

    ].forEach(function (t) {

      b.appendChild(icon(t[0]));

      b.addEventListener('click', function () { goTo(t[2]); });
      nav.appendChild(b);
    });

  function renderHeader() {
    document.getElementById('day').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
    var daily = state.tasks.filter(function (t) { return t.sit !== 'deep'; });
    var total = daily.length;
    var d = daily.filter(function (t) { return isDone(t.id); }).length;
    var pct = total ? Math.round(d / total * 100) : 0;
    document.getElementById('ring-bar').style.strokeDashoffset = String(213.6 * (1 - (total ? d / total : 0)));
    document.getElementById('ring-num').textContent = nf(pct) + '٪';
    document.getElementById('ring-wrap').setAttribute('aria-label', 'خلصتي ' + nf(d) + ' من ' + nf(total) + ' مهمة النهارده');
  }

  function renderTabs() {
    var nav = document.getElementById('tabs');
    nav.textContent = '';
    SITS.forEach(function (s) {
      var tasks = state.tasks.filter(function (t) { return t.sit === s.id; });
      var left = tasks.filter(function (t) { return !isDone(t.id); });
      var mins = left.reduce(function (a, t) { return a + (Number(t.min) || 0); }, 0);
      var b = el('button', 'tab');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(state.tab === s.id));
      b.appendChild(el('span', 'name', s.name));
      b.appendChild(el('span', 'sub', left.length ? nf(left.length) + ' باقي، ' + nf(mins) + ' دقيقة' : 'خلصت كلها'));
      b.addEventListener('click', function () { state.tab = s.id; save(); render(); });
      nav.appendChild(b);
    });
  }

    var R = state.salah.rem;
    var rem = el('div', 'remind-box');
    var sw = el('button', 'swrow');
    sw.type = 'button';
    sw.id = 'rem-switch';
    sw.setAttribute('role', 'switch');
    sw.setAttribute('aria-checked', String(!!R.on));
    var swt = el('span', 'swtxt');
    swt.appendChild(el('span', null, 'تذكير بمواعيد الصلاة'));
    swt.appendChild(el('span', 'swsub', R.on ? 'شغّال، ' + leadLabel(R.lead) : 'مقفول'));
    sw.appendChild(swt);
    sw.appendChild(el('span', 'track2'));
    sw.addEventListener('click', function () {
      R.on = !R.on;
      if (R.on) {
        unlockAudio();
        try {
          var rq = window.Notification && Notification.permission === 'default' ? Notification.requestPermission() : null;
          if (rq && rq.then) rq.then(function () {}, function () {});
        } catch (e) {}
      } else { hideBanner(); }
      save(); renderSalah(); checkReminders();
    });
    rem.appendChild(sw);
    var remRow = el('div', 'startbox');
    var remLab = el('label', null, 'وقت التنبيه');
    remLab.setAttribute('for', 'rem-lead');
    var ls = document.createElement('select');
    ls.id = 'rem-lead'; ls.className = 'citysel';
    [0, 5, 10, 15, 20].forEach(function (n) {
      var o = document.createElement('option'); o.value = String(n); o.textContent = leadLabel(n); if (n === R.lead) o.selected = true; ls.appendChild(o);
    });
    ls.addEventListener('change', function () { R.lead = parseInt(ls.value, 10) || 0; save(); renderSalah(); checkReminders(); });
    remRow.appendChild(remLab); remRow.appendChild(ls);
    rem.appendChild(remRow);
    var tb = el('button', 'btn ghost small', 'جرّبي التنبيه');
    tb.type = 'button';
    tb.addEventListener('click', function () {
      unlockAudio();
      alertNow('تنبيه تجريبي', 'ده شكل التنبيه');
      showBanner(null, 'ده تنبيه تجريبي. بالشكل ده هيظهر قبل كل صلاة.');
    });
    rem.appendChild(tb);
    rem.appendChild(el('p', 'fine', 'التنبيه بيظهر وبيرن لما الصفحة تكون مفتوحة على موبايلك. لو الصفحة اتقفلت أو الشاشة اتقفلت مش هيوصل.'));
    box.appendChild(rem);

    var head2 = el('div', 'panel-head');
    head2.appendChild(el('h2', 'sub-h', 'مواعيد الأذكار'));
    box.appendChild(head2);
    var ul = el('ul', 'list');
    [
      { id: 'wake', text: 'أذكار الاستيقاظ', tip: 'أول ما تصحي من النوم' },
      { id: 'morning', text: 'أذكار الصباح', tip: 'من الفجر ' + hm(t.fajr) + '، والأفضل قبل الشروق ' + hm(t.sunrise), chip: hm(t.fajr) },
      { id: 'after', text: 'أذكار بعد الصلاة', tip: 'بعد كل فرض من الخمسة', chip: 'بعد كل صلاة' },
      { id: 'evening', text: 'أذكار المساء', tip: 'بعد العصر ' + hm(t.asr) + '، والأفضل قبل المغرب ' + hm(t.maghrib), chip: hm(t.asr) },
      { id: 'sleep', text: 'أذكار النوم', tip: 'بعد العشا ' + hm(t.isha) + ' وقبل ما تنامي', chip: hm(t.isha) }
    ].forEach(function (a) {
      var li = el('li', 'item');
      var b = el('button', 'task');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(dh.indexOf(a.id) !== -1));
      var chk = el('span', 'chk'); chk.innerHTML = CHECK;
      var txt = el('span', 'txt');
      txt.appendChild(el('span', 'txt-main', a.text));
      txt.appendChild(el('span', 'tip', a.tip));
      b.appendChild(chk); b.appendChild(txt);
      if (a.chip) b.appendChild(el('span', 'chip', a.chip)); else b.appendChild(el('span'));
      b.addEventListener('click', function () { flagToggle(state.salah.dhikr, a.id); renderSalah(); });
      li.appendChild(b);
      ul.appendChild(li);
    });
    box.appendChild(ul);

    var row = el('div', 'startbox');
    var lab = el('label', null, 'المدينة');
    lab.setAttribute('for', 'salah-city');
    var sel = document.createElement('select');
    sel.id = 'salah-city';
    sel.className = 'citysel';
    CITIES.forEach(function (x) {
      var o = document.createElement('option'); o.value = x.id; o.textContent = x.name; if (x.id === c.id) o.selected = true; sel.appendChild(o);
    });
    sel.addEventListener('change', function () { state.salah.city = sel.value; save(); renderSalah(); });
    row.appendChild(lab); row.appendChild(sel);
    box.appendChild(row);
    box.appendChild(el('p', 'fine', 'المواعيد محسوبة بتوقيت جهازك بطريقة أم القرى للسعودية والهيئة المصرية لمصر، وممكن تفرق دقيقة أو اتنين عن التقويم الرسمي. راجعي تقويم المسجد لو محتاجة دقة.'));
  }

  function parseKey(k) { var p = String(k).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function dShort(d) { return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long' }); }
  function renderBaby() {
    var box = document.getElementById('baby');
    box.textContent = '';
    var B = state.baby;
    var start = parseKey(B.start);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diff = Math.round((today.getTime() - start.getTime()) / 86400000);
    var span = BABY_PLAN.length * 3;

    var head = el('div', 'panel-head');
    head.appendChild(el('h2', null, 'وجبات لولو: أول أكل'));
    head.appendChild(el('p', null, 'صنف واحد جديد كل ٣ أيام، ووجبة واحدة في اليوم بعد الرضعة. اللبن يفضل هو الأساس.'));
    box.appendChild(head);

    var note = el('div', 'note');
    note.appendChild(el('strong', null, 'قبل ما تبدأي'));
    var nl = el('ul');
    [
      'خدي موافقة دكتور الأطفال الأول. التوصية المعتادة إن الأكل يبدأ حوالي ٦ شهور، وبعض الدكاترة بيسمحوا من ٤ شهور لو لولو جاهزة.',
      'علامات الجاهزية: بتثبّت راسها، بتقعد بدعم، مبقتش تدفع الأكل بلسانها، وبتهتم لما بتشوفك بتاكلي.',
      'الأكل ناعم ومهروس تمامًا، بالمعلقة، وهي قاعدة ومسنودة. من غير ملح ولا سكر ولا عسل.',
      'جرّبي صنف واحد بس كل مرة. أي طفح أو قيء أو إسهال أو انتفاخ في الوش: وقفي الصنف وكلمي الدكتور.'
    ].forEach(function (t) { nl.appendChild(el('li', null, t)); });
    note.appendChild(nl);
    box.appendChild(note);

    var card = el('div', 'today');
    var k = todayKey();
    if (diff < 0) {
      card.appendChild(el('div', 'lbl', 'هتبدأي يوم ' + dShort(start) + ' (بعد ' + nf(-diff) + ' يوم)'));
      card.appendChild(el('div', 'nm', 'أول صنف: ' + BABY_PLAN[0].food));
      card.appendChild(el('div', 'lbl', BABY_PLAN[0].how));
    } else if (diff < span) {
      var idx = Math.floor(diff / 3);
      var plan = BABY_PLAN[idx];
      card.appendChild(el('div', 'lbl', 'النهارده، اليوم ' + nf(diff % 3 + 1) + ' من ٣ في الصنف ده'));
      card.appendChild(el('div', 'nm', plan.food));
      card.appendChild(el('div', 'lbl', plan.how));
      var amt = diff < 3 ? 'معلقة أو اتنين صغار' : diff < 7 ? 'من ٢ لـ ٣ معالق صغار' : 'لحد ٣ أو ٤ معالق صغار، ولو رفضت متجبريهاش';
      card.appendChild(el('div', 'lbl', 'الكمية: ' + amt));
      var acts = el('div', 'acts');
      var ate = !!B.done[k];
      var b1 = el('button', ate ? 'btn' : 'btn ghost', ate ? 'اتاكلت النهارده ✓' : 'علّمي إنها أكلت');
      b1.type = 'button';
      b1.setAttribute('aria-pressed', String(ate));
      b1.addEventListener('click', function () { if (B.done[k]) delete B.done[k]; else B.done[k] = true; save(); renderBaby(); });
      var fl = !!B.flag[k];
      var b2 = el('button', fl ? 'btn warn' : 'btn ghost', 'لاحظت رد فعل');
      b2.type = 'button';
      b2.setAttribute('aria-pressed', String(fl));
      b2.addEventListener('click', function () { if (B.flag[k]) delete B.flag[k]; else B.flag[k] = true; save(); renderBaby(); });
      acts.appendChild(b1); acts.appendChild(b2);
      card.appendChild(acts);
      if (fl) card.appendChild(el('div', 'alert', 'وقفي الصنف ده وكلمي دكتور الأطفال قبل ما تكملي. لو في صعوبة في التنفس أو ورم في الوش أو الشفايف، روحي الطوارئ فورًا.'));
    } else {
      card.appendChild(el('div', 'nm', 'خلصتي الخطة'));
      card.appendChild(el('div', 'lbl', 'كلمي دكتور الأطفال علشان تحددوا الأصناف الجاية.'));
    }
    box.appendChild(card);

    var ul = el('ul', 'list');
    BABY_PLAN.forEach(function (p, i) {
      var s = addDays(start, i * 3), e = addDays(start, i * 3 + 2);
      var cur = diff >= i * 3 && diff < i * 3 + 3;
      var past = diff >= i * 3 + 3;
      var li = el('li', 'item');
      var row = el('div', 'task plainrow' + (cur ? ' now' : ''));
      var txt = el('span', 'txt');
      txt.appendChild(el('span', 'txt-main', p.food));
      txt.appendChild(el('span', 'tip', dShort(s) + ' إلى ' + dShort(e)));
      row.appendChild(txt);
      row.appendChild(el('span', 'chip', cur ? 'النهارده' : past ? 'خلص' : 'جاي'));
      li.appendChild(row);
      ul.appendChild(li);
    });
    box.appendChild(ul);

    var lab = el('label', 'startbox');
    lab.setAttribute('for', 'baby-start');
    lab.appendChild(el('span', null, 'يوم البداية'));
    var inp = document.createElement('input');
    inp.type = 'date'; inp.id = 'baby-start'; inp.value = B.start;
    inp.addEventListener('change', function () {
      if (/^\d{4}-\d{2}-\d{2}$/.test(inp.value)) { B.start = inp.value; save(); renderBaby(); }
    });
    lab.appendChild(inp);
    box.appendChild(lab);
  }

  function render() { renderHeader(); renderSalah(); renderTabs(); renderPanel(); renderCycle(); renderDeep(); renderLunch(); renderSnack(); renderBaby(); renderLunchbox(); }

  // add form
  var sel = document.getElementById('new-sit');
  SITS.forEach(function (s) {
    var o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o);
  });
  (function () {
    var o = document.createElement('option'); o.value = 'deep'; o.textContent = 'مهمة عميقة (مرة في الأسبوع)'; sel.appendChild(o);
    var o2 = document.createElement('option'); o2.value = 'cyc'; o2.textContent = 'كل ٣ أيام'; sel.appendChild(o2);
  })();
  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var text = document.getElementById('new-text').value.trim();
    if (!text) return;
    var min = parseInt(document.getElementById('new-min').value, 10) || 10;
    var sit = sel.value;
    var nid = 'u' + Date.now().toString(36), nmin = Math.min(120, Math.max(1, min));
    if (sit === 'cyc') {
      state.cyc.tasks.push({ id: nid, text: text, min: nmin, every: 3, custom: true });
    } else {
      state.tasks.push({ id: nid, text: text, sit: sit, min: nmin, custom: true });
      if (sit !== 'deep') state.tab = sit;
    }
    document.getElementById('new-text').value = '';
    save(); render();
  });

  // reset today, with an in-page confirmation step
  var resetBtn = document.getElementById('reset'), armed = null;
  resetBtn.addEventListener('click', function () {
    if (!armed) {
      resetBtn.textContent = 'تأكيد: امسحي علامات النهارده';
      armed = setTimeout(function () { armed = null; resetBtn.textContent = 'ابدأي اليوم من الأول'; }, 4000);
      return;
    }
    clearTimeout(armed); armed = null;
    state.done[todayKey()] = [];
    resetBtn.textContent = 'ابدأي اليوم من الأول';
    save(); render();
  });

  // roll the day over if the page stays open past midnight
  var lastKey = todayKey();
  setInterval(function () { if (todayKey() !== lastKey) { lastKey = todayKey(); render(); } }, 60000);

  renderStatic();
  render();
  checkReminders();
  setInterval(checkReminders, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkReminders(); });
})();
</script>

</body>
</html>
